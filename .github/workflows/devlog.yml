name: devlog

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for a new post

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/devlog.py https://bluemooncoder.itch.io/nevel-98/devlog.rss devlog.json
      - name: commit
        run: |
          git config user.name "devlog bot"
          git config user.email "actions@users.noreply.github.com"
          git add devlog.json
          git diff --cached --quiet || (git commit -m "Update devlog" && git push)
